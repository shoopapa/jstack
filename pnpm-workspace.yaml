packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@hookform/resolvers": ^5.9.1
  "@ianvs/prettier-plugin-sort-imports": ^4.7.1
  "@radix-ui/react-icons": ^1.3.2
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-query": ^5.104.2
  "@trpc/client": ^11.19.0
  "@trpc/server": ^11.19.0
  "@trpc/tanstack-react-query": ^11.19.0
  "@types/node": ^24.19.2
  dotenv-cli: ^11.0.0
  jiti: ^2.7.0
  lucide-react: ^1.56.0
  next: 16.4.3
  "@teispace/next-themes": ^3.0.2
  oxlint: ^1.87.0
  oxlint-tsgolint: ^7.0.2004
  pino: ^10.4.0
  prettier: 3.9.10
  prettier-plugin-tailwindcss: ^0.8.1
  react-hook-form: ^7.90.0
  sonner: ^2.0.8
  superjson: 2.2.6
  tailwindcss: ^4.3.3
  # TS7 (native Go compiler) ships no JS Compiler API on the bare `typescript`
  # specifier, so anything calling `require('typescript')` needs a CLI path
  # instead. Next >= 16.3 has one: `experimental.useTypeScriptCli` (see
  # apps/nextjs/next.config.js) shells out to `tsc`.
  typescript: ^7.0.2
  vitest: ^5.0.4
  zod: ^4.6.7
  tsx: ^4.23.15

catalogs:
  better-auth:
    better-auth: 1.7.7
  pg:
    "@types/pg": 8.23.1
    kysely: 0.29.6
    kysely-codegen: 0.20.0
    pg: 8.23.1
  react19:
    react: 19.3.0
    react-dom: 19.3.0
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
  t3-oss:
    "@t3-oss/env-nextjs": 0.13.11

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  "@prisma/client": false
  "@prisma/engines": false
  prisma: false
  better-sqlite3: false
  bufferutil: false
  utf-8-validate: false

minimumReleaseAgeExclude:
  - lucide-react@1.56.0
